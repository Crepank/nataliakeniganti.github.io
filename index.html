<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Website List — Natalia Kenig</title>
    <link rel="icon" href="https://avatars.githubusercontent.com/u/141835174" />
    <meta name="description" content="My website list." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  </head>
  <body>
    <header>
      <div>
        <h1>Hello World!</h1>
        <p class="subtitle">This is my website list.</p>
      </div>
      <div class="actions">
        <button id="theme-toggle" title="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main>
      <ul class="site-list">
        <li>
          <a href="https://nataliakeniganti.github.io/fujitsu-movies/" target="_blank" rel="noopener noreferrer">Fujitsu Movies (Fanmade)</a>
          <button class="copy-btn" data-url="https://nataliakeniganti.github.io/fujitsu-movies/">Copy link</button>
        </li>
        <li>
          <a href="https://nataliakeniganti.github.io/flashpak/" target="_blank" rel="noopener noreferrer">Flashpak Mod Manager</a>
          <button class="copy-btn" data-url="https://nataliakeniganti.github.io/flashpak/">Copy link</button>
        </li>
        <li>
          <a href="https://nataliakeniganti.github.io/NLUIA-Store/" target="_blank" rel="noopener noreferrer">NLUIA Store</a>
          <button class="copy-btn" data-url="https://nataliakeniganti.github.io/NLUIA-Store/">Copy link</button>
        </li>
      </ul>
      <p class="note">New websites coming soon! I mean… right?</p>
    </main>

    <div class="toast" id="toast">Link copied!</div>

    <script>
      const toggle = document.getElementById('theme-toggle');
      toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        toggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      });

      const toast = document.getElementById('toast');
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(btn.dataset.url).then(() => {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
          });
        });
      });
    </script>
  </body>
</html>
